name: build

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: setup env
              run: |
                  mkdir -p OpenOrbis

            - name: checkout
              uses: actions/checkout@v7

            - name: OpenOrbis
              run: |
                  cd ${{ github.workspace }}

                  curl -L -o toolchain-llvm-18.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
                  tar -xvf ${{ github.workspace }}/toolchain-llvm-18.tar.gz
                  ls -alhg OpenOrbis/
                  #echo "OO_PS4_TOOLCHAIN=${{ github.workspace }}/toolchain" >> $GITHUB_ENV
                  #echo "${{ github.workspace }}/toolchain/bin" >> $GITHUB_PATH

            - name: make
              run: |
                  #cd hello_world
                  #make

            - name: make pkg
              run: |
                  #make pkg

            - name: publish
              uses: actions/upload-artifact@v4
              with:
                  name: dists
                  path: |
                      */*.pkg
                      */eboot.bin
                  if-no-files-found: warn
