name: build

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: setup env
              run: |
                  sudo apt-get update && sudo apt-get install -y clang lld
                  wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb && sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
                  cd ${{ github.workspace }}
                  curl -L -o toolchain-llvm-18.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
                  tar -xf ${{ github.workspace }}/toolchain-llvm-18.tar.gz

            - name: checkout
              uses: actions/checkout@v7
              with:
                  path: "OpenOrbis/PS4Toolchain/samples/main"

            - name: build
              run: |
                  echo "OO_PS4_TOOLCHAIN=${{ github.workspace }}/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
                  echo "${{ github.workspace }}/OpenOrbis/PS4Toolchain/bin" >> $GITHUB_PATH
                  cd OpenOrbis/PS4Toolchain/samples/main
                  OO_PS4_TOOLCHAIN="${{ github.workspace }}/OpenOrbis/PS4Toolchain" PATH="${{ github.workspace }}/OpenOrbis/PS4Toolchain/bin:${PATH}" make all

            - name: publish
              uses: actions/upload-artifact@v4
              with:
                  files: OpenOrbis/PS4Toolchain/samples/main/*.pkg
                  if-no-files-found: warn
